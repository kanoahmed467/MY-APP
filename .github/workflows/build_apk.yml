name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # فك الضغط بأمان حتى لو اسم الملف فيه مسافات أو أقواس
    - name: Unzip Project Safely
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_temp
          
          # البحث عن مكان gradlew ونقل كل محتويات المشروع للمسار الرئيسي
          GRADLEW_PATH=$(find extracted_temp -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Moving files from $PROJECT_DIR to repository root..."
            cp -rn "$PROJECT_DIR"/* . 2>/dev/null || true
            cp -rn "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "Error: gradlew file not found after unzipping!"
          exit 1
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedManga-App
        path: app/build/outputs/apk/debug/*.apk
