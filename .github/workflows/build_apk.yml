name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط أي ملف zip يلقاه في المستودع تلقائياً
    - name: Extract Zip File
      run: |
        sudo apt-get install -y unzip
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
        fi

    # 2. إعداد بيئة Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. إعداد محرك Gradle تلقائياً
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. البحث عن مكان ملف البناء وتشغيله بأي طريقة متاحة
    - name: Build APK
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle أو build.gradle.kts
        BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        if [ -z "$BUILD_FILE" ]; then
          echo "Error: Could not find build.gradle in the repository!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # استخدام gradlew إن وجد، أو استخدام gradle النظام مباشرة
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "gradlew not found, using system gradle..."
          gradle assembleDebug --stacktrace
        fi

    # 5. رفع ملف الـ APK الجاهز
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeedManga-App
        path: "**/build/outputs/apk/debug/*.apk"
